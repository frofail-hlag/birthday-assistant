<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Birthday Assistant">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Birthday Assistant</title>

  <!-- OneSignal Web SDK v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="cake">🎂</div>
      <h1>Birthday Assistant</h1>
      <p>Never miss an important birthday.</p>
    </header>

    <section class="card">
      <h2>🔔 Notifications</h2>
      <p id="pushStatus">⏳ Connecting to push service...</p>
      <button id="enablePush">🔔 Enable Push Notifications</button>
      <button id="testLocal" class="secondary">🧪 Test Local Notification</button>
    </section>

    <section class="card">
      <h2>🎁 Birthday Cards</h2>
      <p>Personalized birthday cards are coming next.</p>
      <button class="secondary" disabled>🎨 Create Birthday Card</button>
    </section>
  </main>

  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "eafe14ef-fde2-4de8-880f-686a9a28d54e",
          serviceWorkerPath: "onesignal/OneSignalSDKWorker.js",
          serviceWorkerParam: {
            scope: "/birthday-assistant/onesignal/"
          }
        });

        window.dispatchEvent(new Event("onesignal-ready"));
      } catch (error) {
        console.error("OneSignal initialization failed:", error);
        window.dispatchEvent(new CustomEvent("onesignal-error", { detail: error }));
      }
    });
  </script>

  <script src="app.js"></script>
</body>
</html>

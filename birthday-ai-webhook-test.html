<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday AI Webhook Test</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#0b1020;color:#fff;padding:24px}
.box{max-width:700px;margin:auto;background:#151c32;padding:24px;border-radius:20px}
input,textarea,button{width:100%;box-sizing:border-box;padding:14px;margin:7px 0 14px;border-radius:12px;font-size:16px}
input,textarea{background:#0d1428;color:#fff;border:1px solid #3b486c}
button{border:0;background:#7c5cff;color:#fff;font-weight:700}
#status{padding:12px;background:#0d1428;border-radius:12px;white-space:pre-wrap}
img{max-width:100%;margin-top:20px;border-radius:16px}
</style></head>
<body><div class="box">
<h1>✨ AI Image Webhook Test</h1>
<p>Temporary test page for the Birthday Assistant.</p>
<label>Name</label><input id="name" value="Daniel">
<label>Relationship</label><input id="relationship" value="Friend">
<label>Mood</label><input id="mood" value="Funny & Playful">
<label>Interests / Theme</label><input id="interests" value="Football">
<label>Additional Details</label><textarea id="details">Turning 40 and loves football and spending time with friends</textarea>
<button id="go">🚀 Generate AI Birthday Card</button>
<div id="status">Ready.</div><img id="img" hidden>
</div>
<script>
const webhook="https://hook.eu1.make.com/qwyp4tyvxa3ef05kz2k8td114fpi5ra0";
document.getElementById("go").onclick=async()=>{
 const b=document.getElementById("go"),s=document.getElementById("status"),im=document.getElementById("img");
 b.disabled=true; im.hidden=true; s.textContent="⏳ Generating...";
 try{
  const r=await fetch(webhook,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
   name:document.getElementById("name").value,relationship:document.getElementById("relationship").value,
   mood:document.getElementById("mood").value,interests:document.getElementById("interests").value,
   details:document.getElementById("details").value})});
  const blob=await r.blob();
  if(!r.ok) throw new Error("HTTP "+r.status);
  if(!blob.type.startsWith("image/")) throw new Error("Expected image, got "+(blob.type||"unknown"));
  im.src=URL.createObjectURL(blob); im.hidden=false;
  s.textContent="✅ SUCCESS\nHTTP: "+r.status+"\nType: "+blob.type+"\nSize: "+blob.size.toLocaleString()+" bytes";
 }catch(e){s.textContent="❌ TEST FAILED\n"+e.message; console.error(e)}
 finally{b.disabled=false}
};
</script></body></html>

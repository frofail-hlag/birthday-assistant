<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunday School Attendance</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#10263b;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px}.panel{background:white;border:1px solid #e2e8ee;border-radius:16px;padding:18px;margin:14px 0}label{display:block;font-weight:650;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd5df;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:10px 13px;background:#12314d;color:white;font:inherit;cursor:pointer;margin:3px}.secondary{background:#e9eff4;color:#17324a}.hidden{display:none!important}.muted{color:#657788}.tabs{display:flex;gap:6px;flex-wrap:wrap}.student{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf1f4}.status button{background:#e9eff4;color:#234}.status button.selected{background:#12314d;color:white}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f2f6f9;border-radius:10px;padding:12px}.stat strong{display:block;font-size:22px}.row{display:flex;gap:10px;align-items:end}.row>*{flex:1}.notice{padding:11px;border-radius:9px;background:#fff3d6;color:#72520c;margin:10px 0}.error{background:#ffeded;color:#8b2424}.good{background:#e7f5ec;color:#205d38}.small{font-size:13px}@media(max-width:600px){.student{display:block}.status{margin-top:8px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><header><b>📋 Sunday School Attendance</b> <span id="classCaption" class="muted"></span></header>
<section id="login" class="panel"><h1>Teacher access</h1><p class="muted">Choose your class and enter its shared access code.</p><label>Sunday School</label><select id="classId"><option value="AvaKerolos">Ava Kerolos</option><option value="Malayka">Malayka</option><option value="AbounaFaltaous">Abouna Faltaous</option></select><label>Class access code</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Sign in</button><p id="loginMsg" class="small muted"></p></section>
<main id="app" class="hidden"><section class="panel"><b id="className"></b><button id="logout" class="secondary" style="float:right">Sign out</button><div class="tabs"><button data-tab="record">Attendance</button><button data-tab="roster">Roster</button><button data-tab="history">History</button></div></section>
<section id="record" class="panel"><h2>Sunday attendance</h2><div class="row"><div><label>Sunday date</label><input id="date" type="date"></div><button id="load">Load / create</button></div><p id="sessionMsg" class="small muted"></p><div id="summary" class="stats"></div><div id="bulk" class="hidden"><button id="allP" class="secondary">Mark all present</button><button id="allA" class="secondary">Mark all absent</button></div><div id="attendance"></div><div class="row"><span id="completion" class="small muted"></span><button id="finalize" disabled>Finalize session</button></div></section>
<section id="roster" class="panel hidden"><h2>Student roster</h2><p class="small muted">Inactive students are excluded from future sessions; history is retained.</p><div class="row"><input id="newName" maxlength="100" placeholder="Student name"><button id="add">Add student</button></div><div id="rosterList"></div><div id="studentHistoryPanel" class="panel hidden" style="margin-top:16px"><div class="row"><h3 id="studentHistoryTitle">Student history</h3><button id="closeStudentHistory" class="secondary" type="button">Close</button></div><div id="studentHistoryStats" class="stats"></div><div id="studentHistoryList"></div></div></section>
<section id="history" class="panel hidden"><h2>Class history & statistics</h2><button id="refresh" class="secondary">Refresh</button><div id="historyStats" class="stats"></div><div id="historyList"></div></section></main></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const cfg={apiKey:"AIzaSyC3wY9aAdPn33s7GdREM-cmU-S51mVgdFw",authDomain:"birthday-assistant-attendance.firebaseapp.com",projectId:"birthday-assistant-attendance",storageBucket:"birthday-assistant-attendance.firebasestorage.app",messagingSenderId:"204029846079",appId:"1:204029846079:web:d9ebd617549e063fc8ce8a"};
const C={AvaKerolos:{name:"Ava Kerolos",email:"fsobhy+ava@gmail.com",uid:"fX4Ub0z1CFfGhknCLG8jcu5i5du2"},Malayka:{name:"Malayka",email:"fsobhy+malayka@gmail.com",uid:"DSNRFRRBLEYEyZSt6UkKa9E3QMw1"},AbounaFaltaous:{name:"Abouna Faltaous",email:"fsobhy+abouna@gmail.com",uid:"4hdnTRh2hJXbDbz6Eq4Z0Sm3XvP2"}};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let cls=null,uid=null,students=[],session=null,marks=new Map();
const cp=()=>collection(db,"classes",cls,"students"),sp=d=>doc(db,"classes",cls,"sessions",d),rp=d=>collection(db,"classes",cls,"sessions",d,"records");const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const active=()=>students.filter(s=>s.active===true);const say=(id,s,k)=>{$(id).textContent=s;$(id).className=k?"notice "+k:"small muted"};const sunday=d=>new Date(d+"T12:00:00").getDay()===0;
async function loadStudents(){let q=await getDocs(query(cp(),orderBy("StudentName")));students=q.docs.map(x=>Object.assign({id:x.id},x.data()));}
function counts(){let a=Array.from(marks.values());return {p:a.filter(x=>x==="present").length,a:a.filter(x=>x==="absent").length,e:a.filter(x=>x==="excused").length,n:active().length,m:a.length};}
function render(){let c=counts();$("summary").innerHTML=[["Present",c.p],["Absent",c.a],["Excused",c.e],["Unmarked",Math.max(0,c.n-c.m)]].map(x=>"<div class=\"stat\"><span>"+x[0]+"</span><strong>"+x[1]+"</strong></div>").join("");$("completion").textContent=c.m+" of "+c.n+" active students marked";$("finalize").disabled=!session||session.status!=="draft"||c.n===0;$("bulk").classList.toggle("hidden",!session||session.status!=="draft");$("attendance").innerHTML=session?active().map(s=>{let v=marks.get(s.id)||"";return "<div class=\"student\"><div>"+esc(s.StudentName)+"</div><div class=\"status\">"+["present","absent","excused"].map(k=>"<button data-id=\""+s.id+"\" data-v=\""+k+"\" class=\""+(v===k?"selected":"")+"\" "+(session.status==="final"?"disabled":"")+">"+k+"</button>").join("")+"</div></div>"}).join(""):"<p class=\"muted\">Load a Sunday session to begin.</p>";$("attendance").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>mark(b.dataset.id,b.dataset.v));}
async function openSession(){let d=$("date").value;if(!d)return;if(!sunday(d))return say("sessionMsg","Please choose a Sunday.","error");try{await loadStudents();let r=sp(d),s=await getDoc(r);if(s.exists())session=Object.assign({id:d},s.data());else{await setDoc(r,{sessionDate:d,status:"draft",recordedBy:uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});session={id:d,status:"draft",sessionDate:d};}marks.clear();let rs=await getDocs(rp(d));rs.forEach(x=>marks.set(x.id,x.data().attendanceStatus));say("sessionMsg",session.status==="final"?"Finalized session — locked.":"Draft session loaded.");render();}catch(e){say("sessionMsg",e.code+": "+e.message,"error");}}
async function mark(id,v){if(!session||session.status!=="draft")return;try{let r=doc(db,"classes",cls,"sessions",session.id,"records",id),s=await getDoc(r),data={attendanceStatus:v,updatedAt:serverTimestamp(),updatedBy:uid};if(s.exists())await updateDoc(r,data);else await setDoc(r,data);marks.set(id,v);render();}catch(e){say("sessionMsg",e.code+": "+e.message,"error");}}
async function bulk(v){for(let s of active())await mark(s.id,v)}
async function roster(){await loadStudents();$("rosterList").innerHTML=students.map(s=>"<div class=\"student\"><div>"+esc(s.StudentName)+" · "+(s.active?"Active":"Inactive")+"</div><div><button class=\"secondary\" data-student-history=\""+s.id+"\">History</button><button class=\"secondary\" data-edit=\""+s.id+"\">Edit</button><button class=\"secondary\" data-toggle=\""+s.id+"\" data-active=\""+(!s.active)+"\">"+(s.active?"Deactivate":"Reactivate")+"</button></div></div>").join("");$("rosterList").querySelectorAll("[data-student-history]").forEach(b=>b.onclick=()=>studentHistory(b.dataset.studentHistory));$("rosterList").querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{let s=students.find(x=>x.id===b.dataset.edit),n=prompt("Student name",s.StudentName);if(n===null)return;n=n.trim();if(!n||n.length>100)return alert("Name must be 1–100 characters.");try{await updateDoc(doc(db,"classes",cls,"students",s.id),{StudentName:n,updatedAt:serverTimestamp(),updatedBy:uid});roster()}catch(e){alert(e.message)}});$("rosterList").querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,"classes",cls,"students",b.dataset.toggle),{active:b.dataset.active==="true",updatedAt:serverTimestamp(),updatedBy:uid});roster()}catch(e){alert(e.message)}});}
async function studentHistory(studentId){let student=students.find(s=>s.id===studentId);if(!student)return;let panel=$("studentHistoryPanel");panel.classList.remove("hidden");$("studentHistoryTitle").textContent="Attendance history — "+student.StudentName;$("studentHistoryStats").innerHTML="";$("studentHistoryList").textContent="Loading history…";try{let sessions=await getDocs(query(collection(db,"classes",cls,"sessions"),orderBy("sessionDate","desc"))),rows=[];for(let s of sessions.docs){if(s.data().status!=="final")continue;let rec=await getDoc(doc(db,"classes",cls,"sessions",s.id,"records",studentId));if(rec.exists()){let v=rec.data().attendanceStatus;if(["present","absent","excused"].includes(v))rows.push({date:s.id,status:v});}}let p=rows.filter(x=>x.status==="present").length,a=rows.filter(x=>x.status==="absent").length,e=rows.filter(x=>x.status==="excused").length,rate=p+a?Math.round(p/(p+a)*100):null,streak=0;for(let x of rows){if(x.status==="absent")streak++;else break;}$("studentHistoryStats").innerHTML=[["Sessions recorded",rows.length],["Present",p],["Absent",a],["Excused",e],["Attendance rate",rate===null?"—":rate+"%"]].map(x=>"<div class=\"stat\"><span>"+x[0]+"</span><strong>"+x[1]+"</strong></div>").join("");let warning=streak>=3?"<div class=\"notice\">Follow-up advisory: "+streak+" consecutive unexcused absences.</div>":"";$("studentHistoryList").innerHTML=warning+(rows.length?rows.map(x=>"<div class=\"student\"><b>"+x.date+"</b><span>"+x.status+"</span></div>").join(""):"<p class=\"muted\">No finalized attendance records for this student yet.</p>");panel.scrollIntoView({behavior:"smooth",block:"start"});}catch(e){$("studentHistoryList").textContent=e.code+": "+e.message;}}
async function history(){try{let q=await getDocs(query(collection(db,"classes",cls,"sessions"),orderBy("sessionDate","desc"))),rows=[],hist=new Map();for(let s of q.docs){if(s.data().status!=="final")continue;let rs=await getDocs(rp(s.id)),p=0,a=0,e=0;rs.forEach(r=>{let v=r.data().attendanceStatus;if(v==="present")p++;if(v==="absent")a++;if(v==="excused")e++;let arr=hist.get(r.id)||[];arr.push(v);hist.set(r.id,arr)});rows.push({date:s.id,p,a,e,rate:p+a?Math.round(p/(p+a)*100):null})}let p=rows.reduce((n,x)=>n+x.p,0),a=rows.reduce((n,x)=>n+x.a,0),e=rows.reduce((n,x)=>n+x.e,0);$("historyStats").innerHTML=[["Sessions",rows.length],["Present",p],["Absent",a],["Rate",p+a?Math.round(p/(p+a)*100)+"%":"—"]].map(x=>"<div class=\"stat\"><span>"+x[0]+"</span><strong>"+x[1]+"</strong></div>").join("");let alerts=[];for(let s of students){let arr=hist.get(s.id)||[],n=0;for(let v of arr){if(v==="absent")n++;else break}if(n>=3)alerts.push(esc(s.StudentName)+" — "+n+" consecutive unexcused absences")}$("historyList").innerHTML=(alerts.length?"<div class=\"notice\">Follow-up advisory<br>"+alerts.join("<br>")+"</div>":"")+rows.map(x=>"<div class=\"student\"><b>"+x.date+"</b><span>"+x.p+" present · "+x.a+" absent · "+x.e+" excused · "+(x.rate===null?"—":x.rate+"%")+"</span></div>").join("")||"<p class=\"muted\">No finalized sessions yet.</p>"}catch(e){$("historyList").textContent=e.code+": "+e.message}}
async function activateClass(id,user){if(cls===id&&!$("app").classList.contains("hidden"))return;cls=id;uid=user.uid;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("className").textContent=C[id].name;$("classCaption").textContent=C[id].name+" · Attendance";try{await loadStudents();say("sessionMsg",students.length+" students loaded.");let d=new Date();d.setDate(d.getDate()-d.getDay());$("date").value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);render()}catch(e){say("sessionMsg",e.code+": "+e.message,"error");}}
onAuthStateChanged(auth,async user=>{if(!user)return;let entry=Object.entries(C).find(([id,x])=>x.uid===user.uid);if(!entry){await signOut(auth);say("loginMsg","This account is not authorized for an attendance class.","error");return;}await activateClass(entry[0],user);});
$("loginBtn").onclick=async()=>{let id=$("classId").value;try{let u=await signInWithEmailAndPassword(auth,C[id].email,$("password").value);if(u.user.uid!==C[id].uid){await signOut(auth);throw Error("Wrong class account. Signed out for safety.");}}catch(e){say("loginMsg",e.code?e.code+": "+e.message:e.message,"error")}finally{$("password").value=""}};
$("logout").onclick=async()=>{await signOut(auth);location.reload()};$("load").onclick=openSession;$("allP").onclick=()=>bulk("present");$("allA").onclick=()=>bulk("absent");$("finalize").onclick=async()=>{let c=counts();if(c.m!==c.n){let remaining=c.n-c.m;alert("There are still "+remaining+" student"+(remaining===1?"":"s")+" not marked. Please mark every active student before finalizing this session.");return;}if(!confirm("Finalize and lock this Sunday session?"))return;try{await updateDoc(sp(session.id),{status:"final",updatedAt:serverTimestamp()});session.status="final";render();say("sessionMsg","Session finalized and locked.","good")}catch(e){say("sessionMsg",e.code+": "+e.message,"error")}};
$("add").onclick=async()=>{let n=$("newName").value.trim();if(!n||n.length>100)return alert("Enter a name up to 100 characters.");try{let id=crypto.randomUUID().replaceAll("-","");await setDoc(doc(db,"classes",cls,"students",id),{StudentName:n,active:true,createdAt:serverTimestamp(),createdBy:uid});$("newName").value="";roster()}catch(e){alert(e.code+": "+e.message)}};$("refresh").onclick=history;$("closeStudentHistory").onclick=()=>$("studentHistoryPanel").classList.add("hidden");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{["record","roster","history"].forEach(t=>$(t).classList.toggle("hidden",t!==b.dataset.tab));if(b.dataset.tab==="roster")roster();if(b.dataset.tab==="history")loadStudents().then(history)});
</script></body></html>
